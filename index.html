<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Movie Wheel">
<title>Movie Wheel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: two views on one page. Wheel: the dial on the left, the list as a quiet panel on the right. Dashboard: tiles, then cards of bars. Tokens from R7 Orbit (obsidian, ivory, brass). */
:root{
  --bg:#09090a; --surface-1:#0f0f11; --surface-2:#151518; --surface-3:#1b1b1f;
  --line:#ece4d214; --line-strong:#ece4d229; --line-brass:#c9a96a6b;
  --text:#ece6d8; --text-2:#a39e92; --text-3:#6b675f;
  --brass:#c9a96a; --brass-bright:#e3c98f; --brass-dim:#8c7647; --on-brass:#14110a;
  --danger-text:#d9a39b; --st-failed:#b5685e; --st-done:#8fa58a;
  --brass-wash:#c9a96a0d; --brass-wash-strong:#c9a96a1a; --selection:#c9a96a4d; --scrim:#09090adb;
  --display:"Cormorant Garamond","Times New Roman",serif;
  --ui:Inter,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",Consolas,monospace;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  --r-sm:4px; --r-md:8px; --r-lg:12px; --r-pill:99px;
  --ease:cubic-bezier(0.22,1,0.36,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
::selection{background:var(--selection)}
body{margin:0;background:var(--bg);color:var(--text);font:400 13px/1.5 var(--ui);letter-spacing:.005em;padding-inline:var(--s-5);padding-block:var(--s-5) var(--s-7);min-height:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#ece4d20b 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(ellipse at 35% 40%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 35% 40%,#000 0%,transparent 70%)}
.wrap{position:relative;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s-5)}
header{display:flex;flex-direction:column;gap:var(--s-2)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);flex-wrap:wrap}
.nav{display:flex;gap:var(--s-4)}
.nav a{font-size:12px;letter-spacing:.02em;color:var(--text-2);text-decoration:none;padding-block:4px;border-bottom:1px solid transparent}
.nav a:hover{color:var(--brass-bright)}
.nav a[aria-current=page]{color:var(--brass-bright);border-bottom-color:var(--brass)}
.nav a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-3)}
.wordmark{font-size:11px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:var(--text-2)}
h1{font:400 44px/1.05 var(--display);margin:0;text-wrap:balance}
h1 em{font-style:italic;color:var(--brass-bright)}
.main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--s-6);align-items:start}
@media(max-width:820px){.main{grid-template-columns:minmax(0,1fr)} h1{font-size:34px}}

/* wheel */
.stage{display:flex;flex-direction:column;align-items:center;gap:var(--s-4)}
.dial{position:relative;width:min(100%,460px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-6px;width:20px;height:26px;transform:translateX(-50%);z-index:2;transform-origin:50% 20%}
.pointer svg{display:block;width:100%;height:100%}
.pointer.flick{animation:flick 90ms var(--ease)}
@keyframes flick{0%{transform:translateX(-50%) rotate(-14deg)}100%{transform:translateX(-50%) rotate(0)}}
.filter{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:var(--s-2);text-align:center}
.gchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.gchip{height:24px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:transparent;color:var(--text-2);font:400 11px var(--ui);cursor:pointer;transition:border-color 140ms var(--ease),color 140ms var(--ease),background 140ms var(--ease)}
.gchip:hover:not(:disabled){border-color:var(--brass);color:var(--brass-bright)}
.gchip[aria-pressed=true]{border-color:var(--brass);color:var(--brass-bright);background:var(--brass-wash-strong)}
.gchip:disabled{color:var(--text-3);cursor:default}
.gchip:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.gchip .n{font:400 10px var(--mono);color:var(--text-3)}
.gchip[aria-pressed=true] .n{color:var(--brass-dim)}
.spinrow{display:flex;gap:var(--s-3);align-items:center;flex-wrap:wrap;justify-content:center}
.hub{position:absolute;left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%);border-radius:50%;background:#020203;border:1px solid var(--brass);display:grid;place-items:center;color:var(--brass);font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:0;cursor:pointer;font-family:var(--ui);transition:color 140ms var(--ease),border-color 140ms var(--ease)}
.hub:hover:not(:disabled){color:var(--brass-bright);border-color:var(--brass-bright)}
.hub:disabled{color:var(--text-3);border-color:var(--line-strong);cursor:default}
.empty-wheel{position:absolute;inset:8%;display:grid;place-items:center;text-align:center;padding:var(--s-5);color:var(--text-2);border-radius:50%;border:1px dashed var(--line-strong)}
.empty-wheel b{display:block;font:500 24px/1.2 var(--display);color:var(--text);margin-bottom:var(--s-1)}

/* buttons */
.btn{font:500 12px/1 var(--ui);letter-spacing:.02em;height:28px;padding:0 var(--s-3);border-radius:var(--r-sm);background:transparent;color:var(--text);border:1px solid var(--line-strong);cursor:pointer;transition:border-color 140ms var(--ease),color 140ms var(--ease),background 140ms var(--ease)}
.btn:hover:not(:disabled){border-color:var(--brass);color:var(--brass-bright)}
.btn:active:not(:disabled){transform:translateY(.5px)}
.btn:focus-visible,.field:focus-visible,.seg button:focus-visible,.hub:focus-visible,.icon-btn:focus-visible,.star:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.solid{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.btn.solid:hover:not(:disabled){background:var(--brass-bright);border-color:var(--brass-bright);color:var(--on-brass)}
.btn.big{height:38px;padding:0 var(--s-6)}
.btn.quiet{border-color:transparent;color:var(--text-2)}
.btn.quiet:hover:not(:disabled){border-color:var(--line-strong)}
.btn:disabled{color:var(--text-3);border-color:var(--line);cursor:default;background:transparent}

/* result */
.result{width:100%;max-width:460px;background:var(--brass-wash);border:1px solid var(--line-brass);border-radius:var(--r-md);padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-3);animation:arrive 420ms var(--ease)}
.result h2{font:500 34px/1.1 var(--display);margin:0;color:var(--brass-bright);overflow-wrap:anywhere;text-wrap:balance}
.result .row{display:flex;gap:var(--s-2);flex-wrap:wrap}
@keyframes arrive{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* list panel */
.panel{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-4);min-width:0}
.add{display:flex;gap:var(--s-2)}
.sw{position:relative;flex:1;min-width:0;display:flex}
.sw .field{width:100%}
.field{flex:1;min-width:0;height:38px;background:var(--bg);color:var(--text);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 var(--s-3);font:400 13px var(--ui)}
.field::placeholder{color:var(--text-3)}
.field:focus{border-color:var(--brass);outline:none}
textarea.field{height:64px;padding:var(--s-2) var(--s-3);resize:vertical;line-height:1.4;font-family:var(--ui)}
.field-error{color:var(--danger-text);font-size:12px;margin-top:calc(var(--s-2) * -1 + 2px)}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--surface-1);border:1px solid var(--line-strong);border-radius:var(--r-md);box-shadow:0 18px 50px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);overflow-y:auto;max-height:320px}
.opt{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-3);padding:var(--s-2) var(--s-3);cursor:pointer}
.opt+.opt{border-top:1px solid var(--line)}
.opt:hover,.opt[aria-selected=true]{background:var(--surface-3)}
.opt .ot{font:500 16px/1.2 var(--display);min-width:0;overflow-wrap:anywhere}
.opt .om{font:400 11px var(--mono);color:var(--text-3);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;align-self:flex-start}
.seg button{height:24px;padding:0 var(--s-3);background:transparent;border:0;color:var(--text-2);font:400 12px var(--ui);cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed=true]{background:var(--surface-3);color:var(--brass-bright)}
.seg .n{font:400 10px var(--mono);color:var(--text-3)}
.seg button[aria-pressed=true] .n{color:var(--brass-dim)}
.wfilter{display:flex;flex-direction:column;gap:var(--s-2)}
.wfilter .gchips{justify-content:flex-start}
.wfilter .rowf{display:flex;gap:var(--s-3);flex-wrap:wrap;align-items:center}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;max-height:520px;overflow-y:auto}
li{flex:none;display:flex;align-items:center;gap:var(--s-2);padding:var(--s-2) var(--s-3);background:var(--surface-1);min-height:44px;min-width:0}
li+li{border-top:1px solid var(--line)}
li:hover{background:var(--surface-2)}
li .tw{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-block:2px}
li .t{font:500 17px/1.15 var(--display);overflow-wrap:anywhere}
li.done .t{color:var(--text-2)}
li .gl{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
li .field{height:28px;font-size:13px}
.chip{font-size:10px;line-height:1;padding:3px 8px;border:1px solid var(--line);border-radius:var(--r-pill);color:var(--text-2)}
.chip.on{color:var(--brass-bright);border-color:var(--line-brass)}
.chip.who{color:var(--text);border-color:var(--line-strong)}
.chip.who.r7{color:var(--brass-bright);border-color:var(--line-brass);background:var(--brass-wash)}
select.field{font-size:16px;padding-right:var(--s-2)}
.chip.len{font-family:var(--mono);color:var(--text-3);border-color:transparent;padding-inline:2px}
.review{font:italic 400 15px/1.3 var(--display);color:var(--text-2);overflow-wrap:anywhere}
.stars{display:inline-flex;gap:0}
.star{background:none;border:0;padding:0 1px;font-size:15px;line-height:1;color:var(--text-3);cursor:pointer;transition:color 140ms var(--ease)}
.star.on{color:var(--brass)}
.star:hover{color:var(--brass-bright)}
li.editing{display:block;background:var(--surface-2);padding:var(--s-3)}
.edit{width:100%;min-width:0;display:flex;flex-direction:column;gap:var(--s-2)}
.picker{display:flex;flex-direction:column;gap:var(--s-2)}
.picker .field{height:28px;font-size:13px}
.editrow{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center;min-width:0}
.editrow .field,.editrow .sw{flex:1 1 140px;min-width:0;width:auto}
.editrow .icon-btn{flex:none}
.editrow .field.num{flex:0 0 96px}
.icon-btn{background:transparent;border:1px solid transparent;color:var(--text-2);border-radius:var(--r-sm);height:24px;min-width:24px;padding:0 var(--s-2);font:400 12px var(--ui);cursor:pointer;white-space:nowrap}
.icon-btn:hover{border-color:var(--line-strong);color:var(--brass-bright)}
.icon-btn.act{border-color:var(--line-strong);color:var(--text)}
.icon-btn.act:hover{border-color:var(--brass);color:var(--brass-bright)}
.icon-btn.x{font-size:16px;line-height:1;padding:0}
.icon-btn.x:hover{color:var(--danger-text);border-color:var(--st-failed)}
.none{padding:var(--s-5) var(--s-4);text-align:center;color:var(--text-2);border:1px dashed var(--line-strong);border-radius:var(--r-md)}
.fine{font-size:11.5px;color:var(--text-3)}
.status{font-size:11px;font-family:var(--mono);color:var(--text-3)}
.backup{display:flex;gap:var(--s-2);align-items:center;flex-wrap:wrap}

/* dashboard */
.dash{display:flex;flex-direction:column;gap:var(--s-5)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:var(--s-3)}
.tile{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-1);min-width:0}
.tile .big{font:500 46px/1.05 var(--display);font-variant-numeric:tabular-nums;color:var(--text)}
.tile .big small{font:400 14px var(--ui);color:var(--text-2);margin-left:6px}
.tile .sub{color:var(--text-2);font-size:12px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:var(--s-4);align-items:start}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s-4) var(--s-4) var(--s-5);display:flex;flex-direction:column;gap:var(--s-3);min-width:0}
.card h2{font:500 24px/1.2 var(--display);margin:0}
.lead{font:400 15px/1.4 var(--ui);color:var(--text-2);margin:0}
.lead b{color:var(--brass-bright);font-weight:500}
.bars{display:flex;flex-direction:column;gap:var(--s-2)}
.bar{display:grid;grid-template-columns:minmax(72px,112px) 1fr 72px;gap:var(--s-3);align-items:center}
.bar .lab{font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{display:block;height:10px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--brass);border-radius:2px}
.bar .val{font:400 11px var(--mono);color:var(--text-2);text-align:right;font-variant-numeric:tabular-nums}
.fav{display:flex;flex-direction:column;gap:2px;padding-block:var(--s-2);border-top:1px solid var(--line)}
.fav:first-of-type{border-top:0}
.fav .t{font:500 18px/1.2 var(--display)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4)}
@media(max-width:520px){.twocol{grid-template-columns:1fr}.bar{grid-template-columns:minmax(64px,92px) 1fr 64px}}
.kv{display:flex;flex-direction:column;gap:2px}
.kv .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-3)}
.kv .v{font:500 18px/1.2 var(--display);overflow-wrap:anywhere}
.kv .m{font:400 11px var(--mono);color:var(--text-3)}

/* ================= phone-first layer: sizes, the bottom tab bar, sheets, rows, the new screens ================= */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{--tabbar-h:64px}
button,a,summary,[role=button],input,select,textarea{touch-action:manipulation}
button{-webkit-tap-highlight-color:transparent}
body{padding-top:calc(var(--s-5) + env(safe-area-inset-top,0px))}
body.lock{overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn svg{flex:none}
/* Text people have to read uses text-2 (6.4:1). text-3 stays for placeholders and disabled things. */
.eyebrow,.chip.len,.fine,.status,.gchip .n,.seg .n,.opt .om,.kv .k,.kv .m{color:var(--text-2)}
.gchip[aria-pressed=true] .n{color:var(--brass)}

/* nav: the top links on a computer, the bottom tab bar on a phone */
.tabbar{display:none}
.tabbar a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
[data-view][hidden]{display:none!important}

/* filters: one button and the filters that are on */
.fbtn{display:inline-flex;align-items:center;gap:8px}
.fbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fbtn .badge{min-width:20px;height:20px;border-radius:99px;background:var(--brass);color:var(--on-brass);font:600 11px/20px var(--ui);text-align:center;padding:0 6px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stage .frow{justify-content:center}
.afchip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 8px 0 12px;border-radius:var(--r-pill);border:1px solid var(--line-brass);background:var(--brass-wash);color:var(--brass-bright);font:400 13px var(--ui);cursor:pointer}
.afchip .x{font-size:16px;line-height:1;color:var(--text-2)}
.afchip:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.lfilter{display:flex;flex-direction:column;gap:var(--s-2)}

/* sheets: a panel that slides up from the bottom on a phone, a dialog in the middle on a computer */
.sheet-wrap{position:fixed;inset:0;z-index:100}
.sheet-scrim{position:absolute;inset:0;background:var(--scrim);animation:fadein 200ms var(--ease)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90dvh;display:flex;flex-direction:column;background:var(--surface-1);border:1px solid var(--line-strong);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -18px 50px rgba(0,0,0,.55);animation:sheetup 280ms var(--ease);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .grab{flex:none;width:40px;height:4px;border-radius:4px;background:var(--line-strong);margin:8px auto 0}
.sheet-head{flex:none;display:flex;align-items:center;gap:8px;padding:6px 8px 4px 20px}
.sheet-head h2{flex:1;min-width:0;margin:0;font:500 26px/1.2 var(--display);overflow-wrap:anywhere}
.sheet-head .icon-btn{font-size:22px}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:8px 20px 16px;display:flex;flex-direction:column;gap:20px;min-height:0}
.sheet-foot{flex:none;display:flex;gap:var(--s-2);padding:12px 20px 16px;border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1}
.sheet-foot .btn.solid{flex:2}
.sec{display:flex;flex-direction:column;gap:var(--s-2)}
.sec>h3{margin:0;font:500 11px var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--text-2)}
.sheet .gchips{justify-content:flex-start;gap:8px}
.sheet .seg{display:flex;width:100%}
.sheet .seg button{flex:1;justify-content:center}
.sheet .picker .gchips{gap:8px}
.sheet .field{width:100%}
.sheet .sec>.field{flex:none}
.sheet textarea.field{min-height:110px}
.sheet .row2{display:flex;gap:var(--s-2)}
.sheet .row2 .field.num{flex:0 0 120px}
.sheet .mtitle{font:500 30px/1.15 var(--display);color:var(--brass-bright);overflow-wrap:anywhere}
.sheet .mmeta{color:var(--text-2);font-size:14px;margin-top:-12px}
.sheet .linkbtn{align-self:flex-start;background:none;border:0;padding:12px 0;color:var(--text-2);font:400 14px var(--ui);text-decoration:underline;cursor:pointer}
.sheet .danger{align-self:flex-start;background:none;border:1px solid transparent;border-radius:var(--r-sm);padding:0 12px;min-height:44px;color:var(--danger-text);font:400 14px var(--ui);cursor:pointer}
.sheet .danger.sure{border-color:var(--st-failed);background:var(--failed-wash,#b5685e1a)}
.sheet .count{font:400 12px var(--mono);color:var(--text-2)}
@keyframes sheetup{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetpop{from{opacity:0;transform:translate(-50%,-47%)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media(min-width:821px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(560px,92vw);max-height:84vh;transform:translate(-50%,-50%);border:1px solid var(--line-strong);border-radius:var(--r-lg);animation:sheetpop 220ms var(--ease);padding-bottom:0}
  .sheet .grab{display:none}
}

/* the add box */
.add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s-2);align-items:stretch}
.add .btn.quiet{grid-column:1/-1;justify-self:start}

/* a movie in a list: the title gets the full width, then its details, then what you can do */
#listHost ul{max-height:none;overflow:visible}
li.row{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:16px;min-height:0}
li.row .t{font:500 21px/1.2 var(--display);overflow-wrap:break-word;hyphens:manual}
li.row.done .t{color:var(--text)}

  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgb(14 14 16/.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line-strong);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;color:var(--text-2);text-decoration:none;font-size:11px;letter-spacing:.02em;border-radius:var(--r-md)}
  .tabbar a[aria-current=page]{color:var(--brass-bright);background:var(--surface-2)}

@media(prefers-reduced-motion:reduce){.sheet,.sheet-scrim{animation:none}}

@media(max-width:820px){
  body[data-view=chat]{padding:env(safe-area-inset-top,0px) 0 0}

}

<body>

<div class="wrap">
  <header>
    <div class="topbar">
      <span class="wordmark">Movie wheel</span>
      <nav class="nav" aria-label="Pages">
        <a href="#wheel" data-view="wheel" aria-current="page">Wheel</a>
        <a href="#dashboard" data-view="dash">Dashboard</a>
        <a href="#reviews" data-view="reviews">Reviews</a>
        <a href="#chat" data-view="chat" hidden>Chat</a>
      </nav>
    </div>
    <h1 id="h1">Spin for <em>tonight's film.</em></h1>
  </header>

  <div class="main" id="viewWheel">
    <section class="stage" aria-label="Wheel">
      <div class="dial">
        <div class="pointer" aria-hidden="true"><svg viewBox="0 0 20 26"><path d="M1 1h18L10 25z" fill="#c9a96a" stroke="#09090a" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
        <canvas id="wheel" role="img" aria-label="Wheel of unwatched movies"></canvas>
        <div class="empty-wheel" id="emptyWheel" hidden><div><b id="emptyTitle">Add two films to begin</b><span id="emptyText">The wheel needs at least two unwatched movies to spin.</span></div></div>
        <button class="hub" id="hub" type="button" aria-label="Spin the wheel">Spin</button>
      </div>
      <div class="filter" id="filter"></div>
      <div class="spinrow">
        <button class="btn solid big" id="spin" type="button">Spin the wheel</button>
        <button class="btn quiet" id="sound" type="button" aria-pressed="true">Sound on</button>
      </div>
      <div id="result" aria-live="polite" style="width:100%;display:flex;justify-content:center"></div>
    </section>

    <section class="panel" aria-label="Movie list">
      <form class="add" id="addForm" autocomplete="off">
        <div class="sw"><input class="field" id="newTitle" type="text" placeholder="Add a movie title" aria-label="Movie title" maxlength="120" enterkeyhint="done"></div>
        <button class="btn" type="submit">Add</button>
        <button class="btn quiet" type="button" id="toggleGenres" aria-expanded="false" aria-controls="addGenres">+ Genres</button>
      </form>
      <div class="fine" id="pickInfo" hidden></div>
      <div id="addGenres" hidden></div>
      <div class="field-error" id="err" role="alert" hidden></div>
      <div class="seg" role="group" aria-label="Show">
        <button type="button" id="tabTodo" aria-pressed="true">To watch <span class="n" id="nTodo">0</span></button>
        <button type="button" id="tabDone" aria-pressed="false">Watched <span class="n" id="nDone">0</span></button>
      </div>
      <div class="lfilter" id="lfilter" hidden></div>
      <div id="listHost"></div>
      <div class="fine" id="note">Mark a movie as watched to take it off the wheel. You can move it back any time.</div>
      <div class="backup" id="backup" hidden>
        <button class="btn quiet" type="button" id="exportBtn">Export list</button>
        <button class="btn quiet" type="button" id="importBtn">Import list</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <span class="fine" id="backupMsg" role="status"></span>
        <span class="fine" id="syncMsg" role="status" hidden></span>
      </div>
    </section>
  </div>

  <div class="dash" id="viewDash" hidden></div>
  <div id="viewReviews" hidden></div>
  <div id="viewChat" hidden></div>
</div>

<nav class="tabbar" aria-label="Main">
  <a href="#wheel" data-view="wheel" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M3.5 12h17M6 6l12 12M18 6L6 18"/></svg><span>Wheel</span></a>
  <a href="#list" data-view="list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6.5h12M8 12h12M8 17.5h12M4 6.5h.01M4 12h.01M4 17.5h.01"/></svg><span>List</span></a>
  <a href="#dashboard" data-view="dash"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span>Dashboard</span></a>
  <a href="#reviews" data-view="reviews"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.8l2.5 5.2 5.7.8-4.1 4 1 5.7L12 16.8 6.9 19.5l1-5.7-4.1-4 5.7-.8z"/></svg><span>Reviews</span></a>
  <a href="#chat" data-view="chat" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a7.5 7.5 0 0 1-10.9 6.7L4 20l1.4-4.3A7.5 7.5 0 1 1 20 12z"/></svg><span>R7</span></a>
</nav>

<script src="config.js"></script>
<script src="sync.js"></script>
<script src="chat.js"></script>
<script>
(function(){
  var TAU = Math.PI*2;
  var C = {bg:'#09090a',s2:'#151518',s3:'#1b1b1f',line:'rgba(236,228,210,0.16)',text:'#ece6d8',brass:'#c9a96a',bright:'#e3c98f',dim:'#8c7647',onBrass:'#14110a'};
  var movies = [];            // {id,title,watched,genres,runtime,year,rating,review,addedAt,watchedAt}
  var tab = 'todo';
  var editingId = null;
  var rot = 0, spinning = false, winnerId = null, dirty = false;
  var store = null;
  var lib = null;             // the film library: {m:[{title,year,runtime,genres,n}], byNorm:Map}
  var view = 'wheel', dashMode = 'count';

  var $ = function(id){return document.getElementById(id)};
  var canvas = $('wheel'), ctx = canvas.getContext('2d');

  /* ---------- storage: shared db when available, localStorage otherwise ---------- */
  var LS = 'movie-wheel-v1';
  function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS)||'[]'); }catch(e){ return []; } }
  function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify(movies)); }catch(e){} }
  function uid(){ return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  var local = {
    add:function(t,g,x){ movies.push(Object.assign({id:uid(),title:t,watched:false,genres:g||[],addedAt:Date.now(),updatedAt:Date.now(),addedBy:me?me.key:''},x||{})); lsSave(); touch(); refresh(); },
    patch:function(id,p){ var m=movies.find(function(x){return x.id===id}); if(m){Object.assign(m,p,{updatedAt:Date.now()}); lsSave(); touch(); refresh();} },
    remove:function(id){ movies=movies.filter(function(x){return x.id!==id}); if(window.MW_SYNC) MW_SYNC.removed(id); lsSave(); touch(); refresh(); }
  };
  function touch(){ if(window.MW_SYNC) MW_SYNC.changed(); }     // tells the sync module (standalone copy only) that the list changed
  function dbStore(db){
    var col = db.collection('movies');
    col.onSnapshot(function(snap){
      movies = snap.docs.map(function(d){ var v=d.data()||{};
        return {id:d.id,title:String(v.title||''),watched:!!v.watched,genres:Array.isArray(v.genres)?v.genres.map(String):[],
          runtime:+v.runtime||0,year:+v.year||0,rating:+v.rating||0,review:String(v.review||''),watchedAt:v.watchedAt||0,addedAt:v.addedAt||0}; });
      refresh();
    }, function(){ store = local; movies = lsLoad(); refresh(); });
    return {
      add:function(t,g,x){ return col.add(Object.assign({title:t,watched:false,genres:g||[],addedAt:Date.now()},x||{})); },
      patch:function(id,p){ return col.doc(id).update(p); },
      remove:function(id){ return col.doc(id).delete(); }
    };
  }

  /* ---------- helpers ---------- */
  function fmtLen(min){ if(!min) return ''; var h=Math.floor(min/60), m=min%60; return h? h+'h '+(m<10?'0':'')+m+'m' : m+'m'; }
  function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim(); }
  function el(tag,cls,text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

  /* ---------- film library: runtimes and genres to suggest while typing ---------- */
  function loadLib(){
    fetch('movies-db.json').then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){
      var names=d.g, m=d.m.map(function(r,i){
        return {title:r[0],year:r[1],runtime:r[2],genres:r[3]?r[3].split(',').map(function(k){return names[+k]}):[],n:norm(r[0]),i:i};
      });
      var byNorm=new Map(); m.forEach(function(x){ if(!byNorm.has(x.n)) byNorm.set(x.n,x); });
      lib={m:m,byNorm:byNorm};
      if(view==='dash') renderDash();
    }).catch(function(){});
  }
  function search(q){
    if(!lib) return [];
    var qn=norm(q); if(qn.length<2) return [];
    var toks=qn.split(' '), t0=[],t1=[],t2=[];
    for(var i=0;i<lib.m.length;i++){
      var x=lib.m[i], n=x.n;
      if(n.indexOf(qn)===0){ t0.push(x); if(t0.length>=8) break; }
      else if(t1.length<8 && n.indexOf(' '+qn)>=0) t1.push(x);
      else if(t2.length<8 && toks.length>1 && toks.every(function(t){return n.indexOf(t)>=0})) t2.push(x);
    }
    return t0.concat(t1,t2).slice(0,8);
  }
  function exactMatch(title){ return lib ? lib.byNorm.get(norm(title)) : null; }

  // dropdown of library matches under a text input (the input's parent is a .sw wrapper)
  function attachSuggest(input,onPick){
    var box=el('div','suggest'); box.setAttribute('role','listbox'); box.hidden=true;
    input.parentNode.append(box);
    input.setAttribute('role','combobox'); input.setAttribute('aria-autocomplete','list'); input.setAttribute('aria-expanded','false');
    var items=[], active=-1;
    function hide(){ box.hidden=true; active=-1; input.setAttribute('aria-expanded','false'); }
    function paint(){ [].forEach.call(box.children,function(c,i){ c.setAttribute('aria-selected',String(i===active)); }); }
    function pick(i){ var x=items[i]; if(!x) return; input.value=x.title; hide(); onPick(x); }
    function show(){
      items=search(input.value); box.innerHTML='';
      if(!items.length){ hide(); return; }
      items.forEach(function(x,i){
        var o=el('div','opt'); o.setAttribute('role','option'); o.setAttribute('aria-selected','false');
        o.append(el('span','ot',x.title), el('span','om',[x.year||'',fmtLen(x.runtime)].filter(Boolean).join(' · ')));
        o.onmousedown=function(e){ e.preventDefault(); pick(i); };
        box.append(o);
      });
      box.hidden=false; active=-1; input.setAttribute('aria-expanded','true');
    }
    input.addEventListener('input',show);
    input.addEventListener('keydown',function(e){
      if(box.hidden) return;
      if(e.key==='ArrowDown'){ e.preventDefault(); active=(active+1)%items.length; paint(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); active=(active-1+items.length)%items.length; paint(); }
      else if(e.key==='Enter' && active>=0){ e.preventDefault(); e.stopPropagation(); pick(active); }
      else if(e.key==='Escape'){ e.stopPropagation(); hide(); }
    });
    input.addEventListener('blur',function(){ setTimeout(hide,120); });
  }

  /* ---------- wheel drawing ---------- */
  function todo(){ return movies.filter(function(m){return !m.watched}).sort(function(a,b){return a.addedAt-b.addedAt}); }

  /* ---------- genres ---------- */
  var PRESET=['Action','Comedy','Drama','Horror','Sci-fi','Thriller','Romance','Animation','Documentary','Fantasy','Mystery','Crime'];
  var selected=[];                 // genre keys chosen as the wheel's filter (a movie matches when it has any of them)
  var srcSel=[];                   // "added by" keys chosen as a filter ('_' stands for movies from before names were tracked)
  var me=null, people=[];          // who is signed in, and the names that "added by" can show (same-site API only)
  function srcKey(m){ return m.addedBy||'_'; }
  function srcName(k){
    if(!k || k==='_') return 'Earlier';
    if(k==='r7') return 'R7';
    var p=people.find(function(x){return x.key===k});
    return p ? p.name : k.charAt(0).toUpperCase()+k.slice(1);
  }
  function srcCounts(list){        // who added the movies in a list: [{key,name,n}], people first, R7 next, then earlier ones
    var map={};
    list.forEach(function(m){ var k=srcKey(m); (map[k]=map[k]||{key:k,name:srcName(k),n:0}).n++; });
    var rank=function(k){ return k==='_' ? 2 : k==='r7' ? 1 : 0; };
    return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){ return (rank(a.key)-rank(b.key)) || a.name.localeCompare(b.name); });
  }
  var editGenres=[];               // genre names being edited on one row
  function gkey(g){ return String(g).trim().toLowerCase(); }
  function gname(g){ g=String(g).trim().replace(/\s+/g,' '); return g.charAt(0).toUpperCase()+g.slice(1); }
  function gens(m){ return Array.isArray(m.genres)?m.genres:[]; }
  function pool(){
    var t=todo();
    if(selected.length) t=t.filter(function(m){ return gens(m).some(function(g){ return selected.indexOf(gkey(g))>=0; }); });
    if(srcSel.length) t=t.filter(function(m){ return srcSel.indexOf(srcKey(m))>=0; });
    return t;
  }
  function genreCounts(list){      // genres on a list of movies: [{key,name,n}] by name
    var map={};
    list.forEach(function(m){ gens(m).forEach(function(g){ var k=gkey(g); if(!k) return; (map[k]=map[k]||{key:k,name:gname(g),n:0}).n++; }); });
    return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return a.name.localeCompare(b.name)});
  }
  function allGenreNames(){        // choices when editing: presets, anything already used, anything added on this row
    var seen={}, out=[];
    PRESET.concat(movies.reduce(function(a,m){return a.concat(gens(m))},[]), editGenres).forEach(function(g){
      var k=gkey(g); if(k && !seen[k]){ seen[k]=1; out.push(gname(g)); }
    });
    return out.sort(function(a,b){return a.localeCompare(b)});
  }
  // Genre buttons plus a box to type a new one. Toggles names in `list` (mutated in place).
  function genrePicker(list){
    var wrap=el('div','picker');
    var chips=el('div','gchips'); chips.style.justifyContent='flex-start';
    var has=function(name){ return list.some(function(x){return gkey(x)===gkey(name)}); };
    var addChip=function(name,on){
      var b=el('button','gchip',name); b.type='button'; b.setAttribute('aria-pressed',String(on));
      b.onclick=function(){
        var k=gkey(name), i=list.findIndex(function(g){return gkey(g)===k});
        if(i>=0){ list.splice(i,1); b.setAttribute('aria-pressed','false'); } else { list.push(name); b.setAttribute('aria-pressed','true'); }
      };
      chips.append(b); return b;
    };
    allGenreNames().forEach(function(g){ addChip(g, has(g)); });
    var cu=el('div','editrow');
    var ci=el('input','field'); ci.placeholder='Type a new genre'; ci.maxLength=24; ci.setAttribute('aria-label','New genre');
    var addCustom=function(){
      var g=gname(ci.value); if(!g) return; ci.value='';
      var ex=Array.prototype.find.call(chips.children,function(c){return gkey(c.textContent)===gkey(g)});
      if(ex){ if(ex.getAttribute('aria-pressed')!=='true') ex.click(); } else { addChip(g,false).click(); }
    };
    ci.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); addCustom(); } };
    cu.append(ci,btn('Add genre','icon-btn act',addCustom));
    wrap.append(chips,cu);
    return wrap;
  }
  /* ---------- sheets: a panel that slides up on a phone (a dialog on a computer) ---------- */
  var sheetNow=null;
  function openSheet(o){
    if(sheetNow) sheetNow.close('replaced');
    var prev=document.activeElement, wrap=el('div','sheet-wrap'), scrim=el('div','sheet-scrim'), sh=el('div','sheet');
    var tid='sh'+Math.random().toString(36).slice(2,7);
    sh.setAttribute('role','dialog'); sh.setAttribute('aria-modal','true'); sh.setAttribute('aria-labelledby',tid);
    var head=el('div','sheet-head'), h=el('h2',null,o.title); h.id=tid;
    var x=el('button','icon-btn','×'); x.type='button'; x.setAttribute('aria-label','Close');
    head.append(h,x);
    var body=el('div','sheet-body'), foot=el('div','sheet-foot');
    sh.append(el('span','grab'),head,body,foot); wrap.append(scrim,sh); document.body.append(wrap); document.body.classList.add('lock');
    var closed=false, handle={body:body,foot:foot,sheet:sh};
    function onKey(e){
      if(e.key==='Escape'){ e.stopPropagation(); close('later'); return; }
      if(e.key!=='Tab') return;

  /* ---------- spin ---------- */

  // Edit a movie in a sheet: title and length, rating and review (watched), genres, who added it, move it between the lists, or remove it.

    var rv=null;

    }

    var by=null;

      [{key:'',name:'Not sure'}].concat(people).forEach(function(p){ var o=el('option',null,p.name); o.value=p.key; by.append(o); });

  function fillReviews(){
    var watched=movies.filter(function(m){return m.watched});

    var texts=watched.filter(function(m){return m.review}).length, nRated=watched.filter(function(m){return m.rating}).length;
    rvUI.summary.textContent = rated.length ? texts+(texts===1?' review':' reviews')+' and '+nRated+(nRated===1?' rating':' ratings')+', across '+watched.length+' watched movies.' : 'Rate or review a watched movie and it shows up here.';
    [rvUI.segMode,rvUI.segSort].forEach(function(s,i){ [].forEach.call(s.children,function(b){ b.setAttribute('aria-pressed',String(b.dataset.v===(i?rvs.sort:rvs.mode))); }); });
    // waiting for your take
    var wt=watched.filter(function(m){return !m.rating && !m.review}).sort(function(a,b){return (b.watchedAt||0)-(a.watchedAt||0)});
    rvUI.waiting.innerHTML='';
    if(wt.length){
      var box=el('div','waiting'); box.append(el('h2',null,'Waiting for your take'));
      box.append(el('div','fine',wt.length+(wt.length===1?' watched movie has':' watched movies have')+' no rating or review yet.'));

        var r=el('div','wrow'); r.append(el('span','t',m.title)); r.append(btn('Rate it','btn',function(){ reviewSheet(m,false); })); box.append(r);
      });

      rvUI.waiting.append(box);
    }
    // the reviews
    var q=rvs.q.trim().toLowerCase();
    var items=rated.filter(function(m){
      if(rvs.mode==='written' && !m.review) return false;
      if(rvs.mode==='fav' && !(m.rating>=4)) return false;
      if(q && (m.title+' '+m.review).toLowerCase().indexOf(q)<0) return false;
      return true;
    });
    items.sort(rvs.sort==='rating' ? function(a,b){return (b.rating-a.rating)||((b.watchedAt||0)-(a.watchedAt||0))} : function(a,b){return (b.watchedAt||b.updatedAt||0)-(a.watchedAt||a.updatedAt||0)});

      var acts=el('div','acts'); acts.append(btn(m.review?'Edit review':'Add a review','btn',function(){ reviewSheet(m,false); }),btn('Edit movie','btn quiet',function(){ editMovie(m.id); })); c.append(acts);
      rvUI.list.append(c);
    });
  }

  /* ---------- dashboard ---------- */
  function bars(rows,fmt){          // rows: [{label,value}] already sorted
    var wrap=el('div','bars'), max=Math.max.apply(null,rows.map(function(r){return r.value}).concat([1]));

      var b=el('div','bar'); b.append(el('span','lab',r.label));

      b.append(el('span','val',fmt?fmt(r):String(r.value))); wrap.append(b);
    });
    return wrap;
  }
  function card(title){ var c=el('section','card'); c.append(el('h2',null,title)); return c; }

    }

    var tiles=el('div','tiles');

    tiles.append(tile('Time watched',String(Math.floor(mins/60)),'h '+(mins%60)+'m', withLen.length? (mins/1440).toFixed(1)+' days · '+withLen.length+' of '+W.length+' films have a length' : 'No lengths yet'));
    tiles.append(tile('Average rating',rated.length? avg.toFixed(1):'–','★', rated.length? rated.length+' of '+W.length+' rated' : 'Rate a movie to start'));

  }
  attachSuggest($('newTitle'),function(x){
    pick=x; newGenres.length=0; newGenres.push.apply(newGenres,x.genres); syncAddGenres();
    if(!$('addGenres').hidden) drawAddPicker();
    setPickInfo();
  });
  $('newTitle').addEventListener('input',function(){ showErr(''); if(pick && norm(this.value)!==pick.n){ pick=null; setPickInfo(); } });
  $('toggleGenres').onclick=function(){
    var host=$('addGenres'), open=host.hidden;
    host.hidden=!open; this.setAttribute('aria-expanded',String(open));
    if(open){ drawAddPicker(); host.addEventListener('click',syncAddGenres); }
  };
  $('addForm').onsubmit=function(e){
    e.preventDefault();
    var v=$('newTitle').value.trim(); if(!v) return;
    if(movies.some(function(m){return m.title.toLowerCase()===v.toLowerCase()})){ showErr('That movie is already on the list.'); return; }
    var x=pick||exactMatch(v), g=newGenres.slice();
    if(x && !g.length && x.genres.length) g=x.genres.slice();
    var extra=x?{runtime:x.runtime,year:x.year}:{};
    showErr(''); $('newTitle').value=''; tab='todo'; pick=null; setPickInfo(); store.add(v,g,extra);
    newGenres.length=0; $('addGenres').hidden=true; $('toggleGenres').setAttribute('aria-expanded','false'); syncAddGenres();
  };
  window.addEventListener('resize',draw);
  window.addEventListener('hashchange',route);
  if(window.matchMedia){ var mq=matchMedia('(max-width: 820px)'); if(mq.addEventListener) mq.addEventListener('change',route); }

  /* ---------- boot ---------- */
  if(window.MW_CHAT) [].forEach.call(document.querySelectorAll('[data-view="chat"]'),function(a){ a.hidden=false; });   // the chat module exists only in the standalone copy

  /* ---------- standalone copy: starting list, export and import (the claude.ai page keeps its list in a shared database) ---------- */
  var SEEDED='movie-wheel-seeded';
  function cleanMovie(x){
    if(!x || typeof x!=='object') return null;
    var t=String(x.title||'').trim().slice(0,120); if(!t) return null;
    return {id:String(x.id||uid()).slice(0,64), title:t, watched:!!x.watched,
      genres:(Array.isArray(x.genres)?x.genres:[]).map(function(g){return gname(g)}).filter(Boolean).slice(0,12),
      runtime:Math.max(0,Math.round(+x.runtime)||0), year:Math.max(0,Math.round(+x.year)||0),
      rating:Math.min(5,Math.max(0,Math.round(+x.rating)||0)), review:String(x.review||'').slice(0,280),
      addedAt:+x.addedAt||Date.now(), watchedAt:+x.watchedAt||0, updatedAt:+x.updatedAt||0,
      addedBy:/^[a-z0-9_-]{1,24}$/.test(String(x.addedBy||'')) ? String(x.addedBy) : ''};
  }
  // R7 (the chat) adds movies here: the same path as the add box, marked as added by R7, skipping titles already on the list.
  function addFromChat(items){
    var added=[], skipped=[], have={};
    movies.forEach(function(m){ have[norm(m.title)]=1; });
    (Array.isArray(items)?items:[]).slice(0,10).forEach(function(it){
      var t=String((it&&it.title)||'').trim().slice(0,120); if(!t) return;
      var year=+(it&&it.year)||0, x=null;
      if(lib) x=lib.m.find(function(e){ return e.n===norm(t) && (!year || e.year===year); }) || exactMatch(t);
      var title=x?x.title:t;
      if(have[norm(title)] || have[norm(t)]){ skipped.push(title); return; }
      have[norm(title)]=1;
      var id=uid(), extra={id:id, addedBy:'r7'};
      if(x){ extra.runtime=x.runtime; extra.year=x.year; } else if(year) extra.year=year;
      store.add(title, x?x.genres.slice():[], extra);
      added.push({id:id,title:title});
    });
    return {added:added, skipped:skipped};
  }
  function cleanList(a){ return (Array.isArray(a)?a:[]).map(cleanMovie).filter(Boolean); }
  function backupMsg(t){ $('backupMsg').textContent=t; }
  if(!window.claude){
    $('backup').hidden=false;
    $('exportBtn').onclick=function(){
      var blob=new Blob([JSON.stringify(movies,null,1)],{type:'application/json'}), a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='movie-wheel-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.append(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
      backupMsg('Exported '+movies.length+' movies.');
    };
    $('importBtn').onclick=function(){ $('importFile').click(); };
    $('importFile').onchange=function(){
      var f=this.files[0]; this.value=''; if(!f) return;
      f.text().then(function(txt){
        var list=cleanList(JSON.parse(txt));
        if(!list.length){ backupMsg('That file has no movies in it. Nothing was changed.'); return; }
        var keep={}; list.forEach(function(m){ keep[m.id]=1; m.updatedAt=Date.now(); });
        movies.forEach(function(m){ if(!keep[m.id] && window.MW_SYNC) MW_SYNC.removed(m.id); });
        movies=list; lsSave(); touch(); try{localStorage.setItem(SEEDED,'1');}catch(e){}
        editingId=null; refresh(); backupMsg('Imported '+list.length+' movies. They replaced the list on this device'+(window.MW_SYNC&&MW_SYNC.enabled()?' and on your other devices.':'.'));
      }).catch(function(){ backupMsg('That file could not be read. Nothing was changed.'); });
    };
  }

  store = local; movies = lsLoad(); route(); refresh();
  // A page can ship a starting list (window.MW_SEED = 'movies-seed.json'). It loads once, on a device with no list, and never again.
  var seeded=false; try{ seeded=localStorage.getItem(SEEDED)==='1'; }catch(e){}
  if(window.MW_CONFIG && window.MW_CONFIG.api){
    fetch(window.MW_CONFIG.api+'/me').then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
      if(d && d.key){ me={key:d.key,name:d.name}; people=Array.isArray(d.people)?d.people:[]; refresh(); }
    }).catch(function(){});
  }
  var seedDone = Promise.resolve();
  if(!movies.length && window.MW_SEED && !seeded){
    seedDone = fetch(window.MW_SEED).then(function(r){ return r.ok ? r.json() : null; }).then(function(a){
      var list=cleanList(a);
      if(list.length && !movies.length && store===local){ movies=list; lsSave(); touch(); try{localStorage.setItem(SEEDED,'1');}catch(e){} refresh(); }
    }).catch(function(){});
  }
  // Keep the list on the Worker so every device shows the same one (standalone copy only; needs the Worker address under Chat settings).
  if(window.MW_SYNC && !window.claude){
    seedDone.then(function(){
      $('syncMsg').hidden=false;
      MW_SYNC.start({
        get:function(){ return movies; },
        set:function(list){ movies=cleanList(list); lsSave(); editingId=null; refresh(); },
        status:function(t){ $('syncMsg').textContent=t; }
      });
    });
  }
  loadLib();
  seedDone.then(function(){ setTimeout(maybePrompt,1300); });     // "What did you think?" for a movie marked watched last time
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  (async function(){
    try{
      if(!window.claude||!claude.use) return;
      var db = await claude.use('db');
      if(db){ movies=[]; store = dbStore(db); }
    }catch(e){}
  })();
})();
</script>
</body>
</html>
